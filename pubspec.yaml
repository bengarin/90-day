name: english_coach_90
description: رفيقي في الإنجليزية — offline 90-day English coach for Arabic speakers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local DB
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Preferences
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Voice (speaking task)
  record: ^6.0.0
  just_audio: ^0.9.40
  permission_handler: ^11.3.1

  # On-device TTS for "listen" buttons (still offline on most Android devices)
  flutter_tts: ^4.2.0

  # Fonts
  google_fonts: ^6.2.1

  # Misc
  intl: ^0.20.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  # Cairo font is loaded via google_fonts (no bundled fonts required).
